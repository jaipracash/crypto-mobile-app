name: crypto_research_app
description: A polished crypto research app powered by a FastAPI backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  flutter_svg: ^2.2.0
  web_socket_channel: ^3.0.3
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dart-svgrepo-com.svg
    - assets/flutter.svg
    - assets/profile-svgrepo-com.svg
    - assets/search-alt-2-svgrepo-com.svg
    - assets/search2.svg
    - assets/star.svg
    - assets/star-filled.svg
    - assets/watchlist.svg
    - assets/not_added.svg
    - assets/filter-svgrepo-com.svg
    - assets/notification-6-svgrepo-com.svg
    - assets/sort-vertical-svgrepo-com.svg
    - assets/chart-candlestick-svgrepo-com.svg
    - assets/no_interente.svg
    - assets/something_went_rong.svg
